<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scam Scanner</title>
    <!-- Anti-Inspection / DevTools Blocking -->
    <script>
      // Disable Right Click
      document.addEventListener('contextmenu', event => event.preventDefault());

      // Disable F12, Ctrl+Shift+I, Ctrl+Shift+J, Ctrl+U
      document.onkeydown = function (e) {
        if (
          e.keyCode === 123 || // F12
          (e.ctrlKey && e.shiftKey && e.keyCode === 73) || // Ctrl+Shift+I
          (e.ctrlKey && e.shiftKey && e.keyCode === 74) || // Ctrl+Shift+J
          (e.ctrlKey && e.keyCode === 85) // Ctrl+U
        ) {
          e.preventDefault();
          return false;
        }
      };

      // Anti-debugging loop (makes console unusable if somehow opened)
      setInterval(() => {
        const start = performance.now();
        debugger;
        if (performance.now() - start > 100) {
          // DevTools is open, we could clear the page here, but the debugger loop is usually annoying enough
          console.clear();
        }
      }, 100);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scam Scanner</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');
    
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      font-family: 'Inter', -apple-system, sans-serif;
      background-color: #000;
      color: #fff;
      overflow: hidden;
      position: relative;
    }

    /* Aurora orbs */
    body::before {
      content: '';
      position: absolute;
      top: -50px; right: -50px;
      width: 150px; height: 150px;
      background: radial-gradient(circle, rgba(139,92,246,0.3) 0%, transparent 70%);
      z-index: -1;
    }
    body::after {
      content: '';
      position: absolute;
      bottom: -50px; left: -50px;
      width: 150px; height: 150px;
      background: radial-gradient(circle, rgba(6,182,212,0.3) 0%, transparent 70%);
      z-index: -1;
    }

    .glass-card {
      background: rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
    }

    h2 { margin: 0 0 4px 0; font-size: 16px; display: flex; align-items: center; gap: 8px; color: #f5f5f7; }
    p { margin: 0; font-size: 13px; color: #9ca3af; line-height: 1.5; }

    .status-card {
      border-color: rgba(16, 185, 129, 0.2);
    }
    .status-card h2 { color: #10b981; }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: white;
      font-family: inherit;
      margin-bottom: 12px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #06b6d4; }
    input::placeholder { color: #4b5563; }

    .btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(135deg, #06b6d4 0%, #8b5cf6 100%);
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      font-family: inherit;
      transition: opacity 0.2s;
      position: relative;
    }
    .btn:hover { opacity: 0.9; }
    
    .btn::after {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; height: 50%;
      background: linear-gradient(to bottom, rgba(255,255,255,0.2), transparent);
      border-radius: 12px 12px 0 0;
      pointer-events: none;
    }

    .result { display: none; margin-top: 12px; padding: 12px; border-radius: 12px; font-size: 13px; font-weight: 600;}
    .result.safe { background: rgba(16, 185, 129, 0.1); color: #10b981; border: 1px solid rgba(16, 185, 129, 0.2); display: block; }
    .result.danger { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); display: block; }

    /* Loader */
    .loader {
      display: none;
      width: 16px; height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="glass-card status-card">
    <h2>
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><path d="m9 12 2 2 4-4"></path></svg>
      Protection Active
    </h2>
    <p>We are actively monitoring links to keep you safe.</p>
  </div>
  
  <div class="glass-card">
    <input type="text" id="urlInput" placeholder="Paste URL to scan manually...">
    <button id="scanBtn" class="btn">
      <span id="btnText">Scan URL</span>
      <div id="btnLoader" class="loader"></div>
    </button>
    <div id="scanResult" class="result"></div>
  </div>
  
  <script src="../js/popup.js"></script>
</body>
</html>
